{% extends "base.html" %}{% block title %}Login{% endblock %}{% block body_class %}page-login{% endblock %}
{% block content %}<section class="auth-scene"><div class="auth-panel"><span class="eyebrow dark">WELCOME BACK</span><h1>Your farm-to-home<br>journey continues.</h1><p class="muted mb-4">Sign in to manage your harvests, orders and fresh discoveries.</p>
<form method="post"><label>Email address</label><input class="form-control" type="email" name="email" required placeholder="you@example.com"><label>Password</label><input class="form-control" type="password" name="password" required placeholder="Your password"><button class="btn btn-green w-100 mt-3">Sign in →</button></form>
<p class="small mt-4">New to Farm2Home? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
