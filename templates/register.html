{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block body_class %}page-register{% endblock %}
{% block content %}<section class="auth-scene"><div class="auth-panel"><span class="eyebrow dark">GROW WITH US</span><h1>Make room for<br>something fresher.</h1><p class="muted mb-4">Create your account as a farmer or a buyer.</p>
<form method="post"><label>Full name</label><input class="form-control" name="name" required placeholder="Your name"><label>Email address</label><input class="form-control" type="email" name="email" required placeholder="you@example.com"><label>Password <small>(minimum 8 characters)</small></label><input class="form-control" type="password" name="password" minlength="8" required><label>Account type</label><select class="form-select" name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option></select><label>Phone number</label><input class="form-control" name="phone" placeholder="Optional"><label>Village / City</label><input class="form-control" name="village" placeholder="Optional"><button class="btn btn-green w-100 mt-3">Create my account →</button></form>
<p class="small mt-4">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
